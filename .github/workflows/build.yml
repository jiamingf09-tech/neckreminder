name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_self_signed:
        description: Also check the self-signed signing path with a throwaway certificate
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job, one artifact: a universal (Apple Silicon + Intel) app.
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests (detection algorithm, schedule, routines)
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Compiler error summary
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/build.log" | sed -E 's#^.*/Sources/##' | sort -u | head -60

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Optional signing. Add these repository secrets to enable it:
      #   MACOS_CERTIFICATE_P12 (base64 of the .p12), MACOS_CERTIFICATE_PASSWORD,
      #   MACOS_SIGNING_IDENTITY (certificate name)
      # Either a paid "Developer ID Application" certificate, or a free self-signed one
      # from scripts/create-signing-cert.sh (keeps macOS permissions across updates).
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: scripts/ci-import-cert.sh

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
        run: scripts/build-app.sh

      - name: Verify universal binary
        run: |
          ARCHS="$(lipo -archs dist/NeckReminder.app/Contents/MacOS/NeckReminder)"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

      # Optional: notarization. Secrets: NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific), NOTARY_TEAM_ID
      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/NeckReminder.app dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple dist/NeckReminder.app
          rm dist/notarize.zip

      - name: Package
        id: package
        run: |
          NAME="NeckReminder-${{ steps.version.outputs.version }}-universal"
          ditto -c -k --keepParent dist/NeckReminder.app "dist/$NAME.zip"
          scripts/make-dmg.sh "dist/$NAME.dmg"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true

  # Proves the free self-signed path works end to end: create a certificate, import and
  # trust it, sign the app, and check the signature's requirement is pinned to the
  # certificate (which is what lets macOS keep permissions across updates).
  verify-self-signed:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_self_signed
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway certificate
        id: cert
        run: |
          set -o pipefail
          scripts/create-signing-cert.sh "NeckReminder CI Test" "$RUNNER_TEMP/cert" | tee "$RUNNER_TEMP/out.txt"
          echo "password=$(sed -n 's/^  MACOS_CERTIFICATE_PASSWORD  //p' "$RUNNER_TEMP/out.txt")" >> "$GITHUB_OUTPUT"
      - name: Import
        env:
          IDENTITY: NeckReminder CI Test
          P12_PASSWORD: ${{ steps.cert.outputs.password }}
        run: P12="$(cat "$RUNNER_TEMP/cert/cert.p12.base64")" scripts/ci-import-cert.sh
      - name: Build and sign
        env:
          CODESIGN_IDENTITY: NeckReminder CI Test
          ARCHS: arm64
        run: scripts/build-app.sh
      - name: Check signature
        run: |
          codesign -dvv dist/NeckReminder.app 2>&1 | grep -E "Authority|Identifier|Signature"
          REQ="$(codesign -d -r- dist/NeckReminder.app 2>&1)"
          echo "$REQ"
          echo "$REQ" | grep -q 'certificate leaf = H"' || echo "$REQ" | grep -q 'certificate root = H"'

  # Keep the Actions page tidy: only the newest build's artifact and the last few runs survive.
  cleanup:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete old artifacts and runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/ci-cleanup.sh
